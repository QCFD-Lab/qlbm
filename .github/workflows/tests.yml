name: Test using pytest

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    if: github.repository_owner == 'QCFD-Lab'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ${{ env.pythonLocation }}
          key: pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ matrix.python-version }}-
      - name: Cache apt packages
        uses: actions/cache@v4
        id: cache-apt
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-libboost-cmake-${{ hashFiles('.github/workflows/tests.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-libboost-cmake-
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libboost-all-dev cmake
      - name: Install qlbm
        id: pip-install
        run: |
          pip install --upgrade pip
          pip install -e .[cpu,dev]
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"
      - name: Run tests
        run: pytest test --doctest-modules --junitxml=junit/test-results.xml --cov=qlbm --cov-report=xml --cov-report=html
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov/